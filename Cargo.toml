[package]
name = "headless"
version = "0.1.0"
edition = "2024"

[dependencies]
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", features = ["json", "gzip", "brotli", "native-certs"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
home = "0.5"
thiserror = "2"
fs2 = "0.4"
signal-hook = "0.3"
ulid = "1"
glob = "0.3"
libc = "0.2"
base64 = "0.22"
tempfile = "3"
scraper = "0.19"
url = "2"
encoding_rs = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
regex = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
