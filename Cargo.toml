[package]
name = "headless"
version = "0.1.0"
edition = "2024"

[dependencies]
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
home = "0.5"
thiserror = "2"
fs2 = "0.4"
signal-hook = "0.3"
ulid = "1"
glob = "0.3"
walkdir = "2"
regex = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
